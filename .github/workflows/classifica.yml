name: Classifica Over 1,5

on:
  repository_dispatch:       # avvio principale: arriva da cron-job.org all'orario esatto
    types: [classifica]
  schedule:                  # riserva: GitHub può ritardare questi avvii anche di molte ore
    - cron: "23 6 * * *"
  workflow_dispatch:         # pulsante "Run workflow" per avviarlo a mano (ricalcola sempre)

permissions:
  contents: write            # per salvare l'archivio nel repository
  pages: write               # per pubblicare la pagina
  id-token: write
  actions: read              # per ritrovare la pagina caricata

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  classifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Calcola la classifica
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          # API-Football: usata solo se esiste il segreto API_FOOTBALL_KEY. Aggiungilo solo quando
          # API-Football conferma che puoi usarla da GitHub, altrimenti l'account viene sospeso di nuovo.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          OGGI=$(TZ=Europe/Rome date +%Y-%m-%d)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "docs/archivio/over15_$OGGI.html" ]; then
            echo "La classifica di oggi è già pubblicata: niente da ricalcolare."
          else
            python bot_over15.py --web docs
          fi

      - name: Salva l'archivio nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Classifica del $(TZ=Europe/Rome date +%Y-%m-%d)" || echo "Niente da salvare"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  pubblica:
    needs: classifica          # parte solo dopo che la classifica è pronta e caricata
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - name: Pubblica la pagina
        id: pubblicazione
        uses: actions/deploy-pages@v4
