name: Classifica Over 1,5

on:
  schedule:
    - cron: "0 7 * * *"     # ogni giorno alle 07:00 UTC (08:00 ora solare italiana, 09:00 ora legale)
  workflow_dispatch:         # pulsante "Run workflow" per avviarlo a mano

permissions:
  contents: write

jobs:
  classifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Calcola la classifica
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python bot_over15.py --web docs

      - name: Pubblica la pagina
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Classifica del $(date +%Y-%m-%d)" || echo "Niente da aggiornare"
          git push
